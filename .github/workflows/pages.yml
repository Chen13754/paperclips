name: Publish game to GitHub Pages
on:
  push:
    branches: [main, 'check/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
      FONTCONFIG_FILE: ${{ github.workspace }}/.cache/fonts.conf
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --cache .cache/npm --no-audit --no-fund
      - run: npm test
      - name: Install isolated test browser
        run: |
          node node_modules/playwright-core/cli.js install chromium
          node -e "console.log('PAPERCLIPS_BROWSER=' + require('playwright-core').chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Prepare Chinese font for screenshots
        run: |
          mkdir -p .cache/fonts .cache/fontconfig
          curl --fail --location 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC%5Bwght%5D.ttf' -o .cache/fonts/NotoSansSC.ttf
          cat > "$FONTCONFIG_FILE" <<EOF
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
          <fontconfig>
            <include>/etc/fonts/fonts.conf</include>
            <dir>$GITHUB_WORKSPACE/.cache/fonts</dir>
            <cachedir>$GITHUB_WORKSPACE/.cache/fontconfig</cachedir>
          </fontconfig>
          EOF
          fc-match ':lang=zh-cn'
      - run: npm run test:manual
      - run: npm run test:browser
      - run: npm run test:design
      - run: npm run test:settings
      - run: npm run test:counter
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: test-results/
          retention-days: 7
  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Package static game only
        run: |
          mkdir public-site
          cp .nojekyll *.html *.js *.css *.png *.svg public-site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
